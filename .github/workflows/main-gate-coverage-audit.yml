name: Main Gate Coverage Audit

on:
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  audit:
    name: Audit / Every Main Commit Has A Gate Verdict
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Audit main gate coverage (fail closed)
        env:
          GH_TOKEN: ${{ github.token }}
        # The script is invoked directly rather than through
        # `make main-gate-coverage-audit`, whose $(VENV_PYTHON) resolves to
        # `.venv/bin/python` - a virtualenv this job never creates. That made
        # every run die with `No such file or directory` and exit 127 before
        # the audit ran at all, so the control had never once evaluated.
        #
        # Invoked BARE. Piping this would report the pipe's exit status and
        # leave the step green while the audit failed - the same cannot-fail
        # defect the audit itself exists to detect.
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          python scripts/audit_main_gate_coverage.py --baseline-sha abcc119ea48d286cf7336fb687a51e0b40d38404 --limit 60 --fail-on-gap
